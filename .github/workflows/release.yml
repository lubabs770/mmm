name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v (dry run; nothing is published)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${{ github.event.inputs.version }}"
          fi
          # versionCode has to increase monotonically: major*10000 + minor*100 + patch.
          core=${name%%-*}
          major=$(echo "$core" | cut -d. -f1); minor=$(echo "$core" | cut -d. -f2); patch=$(echo "$core" | cut -d. -f3)
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          [ "$code" -gt 0 ] || code=1

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "building $name (versionCode $code)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Python client is released on its own (release-client.yml, client-v* tags).
      - name: tests before anything is published
        run: |
          gradle testDebugUnitTest --no-daemon
          pip install pytest
          (cd magisk && python -m pytest -q)

      - name: decode the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MMM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              # A published release must be signed with the release key, or users
              # could never upgrade from it to a signed one.
              echo "::error::MMM_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release"
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MMM_KEYSTORE_BASE64 is not set; building an unsigned APK"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: build the universal apk
        env:
          MMM_KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.p12', runner.temp) || '' }}
          MMM_KEYSTORE_PASSWORD: ${{ secrets.MMM_KEYSTORE_PASSWORD }}
          MMM_KEY_ALIAS: ${{ secrets.MMM_KEY_ALIAS }}
          MMM_KEY_PASSWORD: ${{ secrets.MMM_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PmmmVersionName=${{ steps.version.outputs.name }} \
            -PmmmVersionCode=${{ steps.version.outputs.code }}

      - name: collect the apk and check it is universal
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          tools/check_universal_apk.sh "$apk"
          cp "$apk" "dist/mmm-${{ steps.version.outputs.name }}.apk"

      - name: build the magisk module
        run: |
          magisk/build.sh \
            "dist/mmm-${{ steps.version.outputs.name }}.apk" \
            "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.code }}" \
            "dist/mmm-magisk-${{ steps.version.outputs.name }}.zip"

      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mmm-release-${{ steps.version.outputs.name }}
          path: dist/*

      - name: publish the github release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "MMM ${{ steps.version.outputs.name }}" \
            --generate-notes
