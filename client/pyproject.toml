[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm"
version = "0.1.0"
description = "All of Android from Python, over MMM's reflection RPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["android", "rpc", "sms", "termux", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
]
# No dependencies on purpose: it has to install cleanly on Termux.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mmm = "mmm.cli:main"

[project.urls]
Homepage = "https://github.com/lubabs770/mmm"

[tool.setuptools]
packages = ["mmm", "mmm.android"]

[tool.setuptools.package-data]
mmm = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
