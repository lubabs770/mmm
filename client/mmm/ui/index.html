<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MMM</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Sections">
      <div class="brand">MMM</div>
      <button data-view="messages">Messages</button>
      <button data-view="rules">Rules</button>
      <button data-view="phone">Phone</button>
      <button data-view="mmm">MMM settings</button>
      <button data-view="android">Android settings</button>
      <button data-view="console">Console</button>
      <button data-view="mac">Mac</button>
      <div class="link" id="link" title="Phone link"><span class="dot"></span><span id="link-text">connecting…</span></div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
